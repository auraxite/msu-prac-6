[build-system]
requires = ["setuptools>=82.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mood"
version = "0.1"
description = "Многопользовательская консольная игра"
requires-python = ">=3.13"
dependencies = [
    "python-cowsay",
]

[project.scripts]
mood-client = "mood.client.__main__:main"
mood-server = "mood.server.__main__:serve"

[tool.setuptools.packages.find]
include = ["mood*"]

[tool.setuptools.package-data]
mood = [
    "client/custom_monsters/*.txt",
    "server/locale/*/LC_MESSAGES/*.mo",
]

[tool.setuptools.data-files]
"share/mood/docs" = [
    "docs/build/html/*.html",
    "docs/build/html/*.js",
]
"share/mood/docs/_sources" = [
    "docs/build/html/_sources/*",
]
"share/mood/docs/_static" = [
    "docs/build/html/_static/*",
]
